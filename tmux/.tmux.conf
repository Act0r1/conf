# Shell
set -g default-shell /bin/zsh



setw -g allow-rename off
set -g history-limit 500000
set -g detach-on-destroy off
setw -g automatic-rename off
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g xterm-keys on
set -s escape-time 1
set -sg repeat-time 100
set -s focus-events on
set-option -g prefix C-a

set-option -g renumber-windows on

# set-option -g status-justify center
set-option -g status-justify absolute-centre


# hotkeys
unbind C-b
unbind n
unbind p
unbind x
#session moving
bind n switch-client -n
bind p switch-client -p
bind-key C-a send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind x kill-pane
bind c new-window #-c "#{pane_current_path}"
#bind -r h select-pane -L
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-l send-keys "clear" C-m
bind-key m send-keys "cmatrix" C-m
bind-key b send-keys "bws" C-m
# bind -r C-h previous-window
# bind -r C-l next-window
bind Tab last-window



# set -g @vim_navigator_mapping_left "C-h"  # use C-h and C-Left
# set -g @vim_navigator_mapping_right "C-l"
# set -g @vim_navigator_mapping_up "C-k"
# set -g @vim_navigator_mapping_down "C-j"
# set -g @vim_navigator_mapping_prev ""
#

# split current window horizontally
bind - split-window -v
bind _ split-window -h
# set -g @vim_navigator_prefix_mapping_clear_screen ""
bind-key -Tcopy-mode-vi MouseDragEnd1Pane send-key -X copy-pipe "xclip -in -r -selection clipboard"
bind-key -Tcopy-mode-vi Y send -X copy-pipe "xclip -in -selection clipboard -r"
# set -gq allow-passthrough on

set -g @t-fzf-prompt '  '
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

run '~/.tmux/plugins/tpm/tpm'
